# ==============================================================================
# Lefthook Git Hooks Configuration
# ==============================================================================
# Docs: https://lefthook.dev/configuration/
#
# Install hooks: pnpm lefthook install
# ==============================================================================

pre-commit:
  parallel: true
  commands:
    biome:
      glob: '*.{ts,tsx,js,jsx,json,jsonc}'
      run: npx biome check --write {staged_files}
      stage_fixed: true
    eslint:
      glob: 'src/**/*.{ts,tsx,js,jsx}'
      run: npx eslint --fix {staged_files}
      stage_fixed: true
    typecheck:
      run: npx tsc --noEmit
    actionlint:
      glob: '.github/workflows/*.{yml,yaml}'
      run: actionlint {staged_files}

commit-msg:
  commands:
    conventional-commit:
      # A script file, not an inline block: on Windows lefthook passes inline
      # scripts to `sh -c "..."` without escaping their own double quotes, and
      # the inline version never parsed. See the header of the script.
      run: node scripts/verify-commit-msg.mjs {1}

pre-push:
  parallel: true
  commands:
    test:
      run: pnpm test
    check:
      run: pnpm check
    # dist/ is what the MCP client actually executes. Left to drift, a change
    # under src/ is invisible at runtime and reads exactly like a missing
    # feature — so the build runs here rather than being remembered.
    build:
      run: pnpm build
