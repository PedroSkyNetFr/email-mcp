# ==============================================================================
# Lefthook Git Hooks Configuration
# ==============================================================================
# Docs: https://lefthook.dev/configuration/
#
# Install hooks: pnpm lefthook install
# ==============================================================================

pre-commit:
  parallel: true
  commands:
    biome:
      glob: '*.{ts,tsx,js,jsx,json,jsonc}'
      run: npx biome check --write {staged_files}
      stage_fixed: true
    eslint:
      glob: 'src/**/*.{ts,tsx,js,jsx}'
      run: npx eslint --fix {staged_files}
      stage_fixed: true
    typecheck:
      run: npx tsc --noEmit
    actionlint:
      glob: '.github/workflows/*.{yml,yaml}'
      run: actionlint {staged_files}

commit-msg:
  commands:
    conventional-commit:
      # Un fichier de script, pas un bloc en ligne : sous Windows, lefthook passe
      # les scripts en ligne à `sh -c "..."` sans échapper leurs propres
      # guillemets doubles, et la version en ligne n'était jamais analysée.
      # Voir l'en-tête du script.
      run: node scripts/verify-commit-msg.mjs {1}

pre-push:
  parallel: true
  commands:
    test:
      run: pnpm test
    check:
      run: pnpm check
    # dist/ is what the MCP client actually executes. Left to drift, a change
    # under src/ is invisible at runtime and reads exactly like a missing
    # feature — so the build runs here rather than being remembered.
    build:
      run: pnpm build

# dist/ est ce que les clients MCP exécutent, et il n'est pas versionné : sans
# reconstruction, un pull ou un changement de branche laisse tourner l'ancienne
# version sans rien dire. Le script décide selon le hook et ses arguments ; voir
# son en-tête.
post-merge:
  commands:
    rebuild-dist:
      run: node scripts/rebuild-after-update.mjs post-merge

post-checkout:
  commands:
    rebuild-dist:
      run: node scripts/rebuild-after-update.mjs post-checkout {1} {2} {3}

post-rewrite:
  commands:
    rebuild-dist:
      run: node scripts/rebuild-after-update.mjs post-rewrite {1}
